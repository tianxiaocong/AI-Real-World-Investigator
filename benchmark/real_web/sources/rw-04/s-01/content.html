                <h1>宇树科技完成近10亿元B2轮融资，美团领投</h1>
                <p>36氪独家获悉，人形机器人公司宇树科技（Unitree）已于2024年完成近10亿元人民币B2轮融资，由美团战略领投，金石投资、源码资本等老股东跟投。</p>
                <p>本轮融资资金将主要用于产品研发、业务拓展以及人形机器人本体量产矩阵建设。</p>
